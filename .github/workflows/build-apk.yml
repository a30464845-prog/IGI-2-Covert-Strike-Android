name: Covert Strike - Full Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.0.38f1
  PROJECT_NAME: CovertStrike

jobs:
  # ============================================
  # STEP 1: TESTS RUN KARO
  # ============================================
  test:
    name: Run Tests 🧪
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.PROJECT_NAME }}-${{ env.UNITY_VERSION }}
          restore-keys: |
            Library-${{ env.PROJECT_NAME }}-
            Library-

      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          artifactsPath: test-results

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7

  # ============================================
  # STEP 2: PC (Windows) BUILD
  # ============================================
  build-pc:
    name: Build Windows 🖥️
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**') }}
          restore-keys: |
            Library-Windows-${{ env.UNITY_VERSION }}-
            Library-Windows-

      - name: Build Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildName: ${{ env.PROJECT_NAME }}
          buildsPath: build/Windows

      - name: Upload PC Build
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build/Windows
          retention-days: 30

  # ============================================
  # STEP 3: ANDROID BUILD
  # ============================================
  build-android:
    name: Build Android 📱
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**') }}
          restore-keys: |
            Library-Android-${{ env.UNITY_VERSION }}-
            Library-Android-

      - name: Build Android AAB
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidAppBundle: true
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          buildName: ${{ env.PROJECT_NAME }}
          buildsPath: build/Android

      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: build/Android
          retention-days: 30

  # ============================================
  # STEP 4: itch.io PE PUBLISH KARO (PC)
  # ============================================
  deploy-itchio:
    name: Deploy to itch.io 🎮
    runs-on: ubuntu-latest
    needs: build-pc
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-windows
          path: build/Windows

      - name: Publish to itch.io
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: windows
          ITCH_GAME: covert-strike
          ITCH_USER: tumhara-username
          PACKAGE: build/Windows

  # ============================================
  # STEP 5: GOOGLE PLAY PE PUBLISH KARO
  # ============================================
  deploy-playstore:
    name: Deploy to Play Store 📲
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-android
          path: build/Android

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Upload to Play Store (Internal Testing)
        uses: RageAgainstThePixel/upload-google-play-console@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-directory: build/Android

  # ============================================
  # STEP 6: GITHUB RELEASE BANAO
  # ============================================
  release:
    name: Create GitHub Release 📦
    runs-on: ubuntu-latest
    needs: [build-pc, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-windows
          path: build/Windows

      - uses: actions/download-artifact@v4
        with:
          name: build-android
          path: build/Android

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Windows/**
            build/Android/**
          draft: false
          prerelease: false

  # ============================================
  # STEP 7: DISCORD NOTIFICATION
  # ============================================
  notify:
    name: Discord Notification 🔔
    runs-on: ubuntu-latest
    needs: [deploy-itchio, deploy-playstore]
    if: always()
    steps:
      - name: Send Discord Message
        uses: Ilshidur/action-discord@0.3
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            **Covert Strike Build**
            Status: ${{ needs.build-pc.result }} (PC) / ${{ needs.build-android.result }} (Android)
            Commit: ${{ github.sha }}
            By: ${{ github.actor }}   
