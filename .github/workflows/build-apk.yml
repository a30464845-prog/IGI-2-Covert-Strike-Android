name: Covert Strike - Full Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.0.38f1

jobs:
  # ============================================
  # STEP 1: TESTS
  # ============================================
  test:
    name: Run Tests 🧪
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4.3.2    ← ✅ PINNED
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7

  # ============================================
  # STEP 2: PC BUILD
  # ============================================
  build-pc:
    name: Build Windows 🖥️
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Build Windows
        uses: game-ci/unity-builder@v4.8.2    ← ✅ PINNED
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildName: CovertStrike
          buildsPath: build/Windows

      - name: Upload PC Build
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build/Windows
          retention-days: 30

  # ============================================
  # STEP 3: ANDROID BUILD
  # ============================================
  build-android:
    name: Build Android 📱
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Build Android
        uses: game-ci/unity-builder@v4.8.2    ← ✅ PINNED
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          buildName: CovertStrike
          buildsPath: build/Android

      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: build/Android
          retention-days: 30

  # ============================================
  # STEP 4: DISCORD NOTIFICATION
  # ============================================
  notify:
    name: Discord Notification 🔔
    runs-on: ubuntu-latest
    needs: [build-pc, build-android]
    if: always()
    steps:
      - name: Send Discord Message
        uses: Ilshidur/action-discord@0.3
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            **Covert Strike Build**
            PC: ${{ needs.build-pc.result }} | Android: ${{ needs.build-android.result }}
            Commit: ${{ github.sha }} by ${{ github.actor }}   
