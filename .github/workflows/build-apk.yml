name: Build IGI2 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ─── 1. Code download ───
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ─── 2. .NET 10 SDK ───
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ─── 3. JDK 17 (Gradle) ───
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ─── 4. Android SDK + NDK ───
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK + CMake
        run: |
          echo "y" | sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      # ─── 5. .NET ARM64 DLLs build ───
      - name: Build .NET (ARM64)
        run: |
          dotnet publish apps/ProjectIGI.Android/ProjectIGI.Android.csproj \
            -c Release \
            -r android-arm64 \
            --no-self-contained \
            -o publish/

      # ─── 6. DLLs APK me deploy (CRITICAL STEP) ───
      - name: Deploy Managed Assets
        run: |
          # deploy_managed_assets.ps1 is a PowerShell script
          # Ubuntu runners have pwsh pre-installed
          pwsh -File deploy_managed_assets.ps1

      # ─── 7. Gradle Release APK build ───
      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleRelease

      # ─── 8. APK rename with commit hash ───
      - name: Rename APK
        run: |
          APK_PATH=$(find app/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          HASH=$(echo ${{ github.sha }} | cut -c1-7)
          cp "$APK_PATH" "IGI2-Android-${HASH}.apk"

      # ─── 9. Upload (Actions tab se download) ───
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IGI2-Android-APK
          path: IGI2-Android-*.apk
          retention-days: 30

      # ─── 10. (Optional) Release pe attach ───
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: IGI2-Android-*.apk
          draft: true
          generate_release_notes: true   
