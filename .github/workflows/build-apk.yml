name: Build IGI2 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ─── 1. Code download (Node 24) ───
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # ─── 2. .NET 10 SDK (Node 24) ───
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # ─── 3. JDK 17 (Node 24) ───
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ─── 4. Android SDK (Node 24, no tools package) ───
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # ─── 5. NDK + CMake + Platform ───
      - name: Install NDK + CMake + Platform
        run: |
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      # ─── 6. .NET ARM64 DLLs build ───
      - name: Build .NET (ARM64)
        run: |
          dotnet publish apps/ProjectIGI.Android/ProjectIGI.Android.csproj \
            -c Release \
            -r android-arm64 \
            --no-self-contained \
            -o publish/

      # ─── 7. DLLs APK me deploy ───
      - name: Deploy Managed Assets
        run: |
          pwsh -File deploy_managed_assets.ps1

      # ─── 8. Gradle Release APK ───
      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleRelease

      # ─── 9. APK rename ───
      - name: Rename APK
        run: |
          APK_PATH=$(find app/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          HASH=$(echo ${{ github.sha }} | cut -c1-7)
          cp "$APK_PATH" "IGI2-Android-${HASH}.apk"

      # ─── 10. Upload ───
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IGI2-Android-APK
          path: IGI2-Android-*.apk
          retention-days: 30   
